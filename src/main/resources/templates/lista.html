<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <title>Lista de Produtos</title>
</head>
<body>
<div class="container mt-5 mb-5">
    <h1 class="mb-4">Lista de Produtos</h1>

    <!-- Mensagem de sucesso (flash attribute enviado pelo Controller) -->
    <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}"></div>

    <div class="card">
        <div class="card-body">

            <!-- Busca / filtro (GET /lista?busca=...&categoria=...) -->
            <form class="form-inline mb-4" th:action="@{/lista}" method="get">
                <input class="form-control mr-2 mb-2" type="text" name="busca" th:value="${busca}"
                       placeholder="Buscar por nome..." />
                <select class="form-control mr-2 mb-2" name="categoria">
                    <option value="">Todas as categorias</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"
                            th:selected="${c == categoriaSelecionada}">Categoria</option>
                </select>
                <button class="btn btn-primary mr-2 mb-2" type="submit">Filtrar</button>
                <a class="btn btn-outline-secondary mb-2" th:href="@{/lista}">Limpar</a>
            </form>

            <!-- th:if → lista vazia -->
            <div class="alert alert-info" role="alert" th:if="${#lists.isEmpty(produtos)}">
                Nenhum produto encontrado.
            </div>

            <!-- th:unless → só mostra a tabela quando há produtos -->
            <div class="table-responsive" th:unless="${#lists.isEmpty(produtos)}">
                <table class="table table-striped">
                    <thead class="thead-dark">
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Categoria</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="produto, iterStat : ${produtos}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${produto.nome}">Nome</td>
                        <td th:text="${produto.descricao}">Descrição</td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</td>
                        <td th:text="${produto.estoque}"
                            th:classappend="${produto.estoque < 5} ? 'estoque-baixo'">0</td>
                        <td th:text="${produto.categoria}">Categoria</td>
                        <td>
                            <form th:action="@{/remover/{id}(id=${produto.id})}" method="post"
                                  onsubmit="return confirm('Remover este produto?');">
                                <button class="btn btn-sm btn-danger" type="submit">Remover</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <p class="text-muted" th:unless="${#lists.isEmpty(produtos)}"
               th:text="${produtos.size()} + ' produto(s) exibido(s)'"></p>

            <a th:href="@{/cadastrar}" class="btn btn-primary">+ Cadastrar novo produto</a>
        </div>
    </div>
</div>
</body>
</html>
